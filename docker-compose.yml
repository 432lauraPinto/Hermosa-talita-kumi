version: '3.8'

# =====================================================================
# DOCKER COMPOSE — HERMOSA TALITA KUMI
# Plataforma Web Integral y Automatizada
# Zona Horaria: America/La_Paz (UTC-4)
# =====================================================================

services:
  # 1. Base de Datos MySQL 8.0 (Aislada en red interna, sin puerto expuesto al host)
  mysql:
    image: mysql:8.0
    container_name: htk_mysql
    restart: unless-stopped
    environment:
      TZ: ${TZ:-America/La_Paz}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret_pass_2026}
      MYSQL_DATABASE: ${DB_NAME:-estetica_db}
      MYSQL_USER: ${DB_USER:-estetica_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-estetica_pass_2026}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-root_secret_pass_2026}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - htk_net

  # 2. Backend Node.js Express API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: htk_backend
    restart: unless-stopped
    environment:
      TZ: ${TZ:-America/La_Paz}
      PORT: 5000
      NODE_ENV: production
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER:-estetica_user}
      DB_PASSWORD: ${DB_PASSWORD:-estetica_pass_2026}
      DB_NAME: ${DB_NAME:-estetica_db}
      JWT_SECRET: ${JWT_SECRET:-talita_kumi_jwt_access_secret_key_2026_secure}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-talita_kumi_jwt_refresh_secret_key_2026_secure}
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:-AdminTalita2026!}
      N8N_SERVICE_API_KEY: ${N8N_SERVICE_API_KEY:-htk_internal_n8n_service_token_2026}
      N8N_WEBHOOK_URL: http://n8n:5678/webhook/agente-ia
      AI_PROVIDER: ${AI_PROVIDER:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      MAX_IMAGE_SIZE_MB: 2
      UPLOAD_DIR: /app/uploads
    ports:
      - "5000:5000"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000/api/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - htk_net

  # 3. Frontend React SPA con Nginx
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: htk_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - htk_net

  # 4. n8n Motor de Automatizaciones y Agente de IA
  n8n:
    image: n8nio/n8n:latest
    container_name: htk_n8n
    restart: unless-stopped
    environment:
      - TZ=${TZ:-America/La_Paz}
      - GENERIC_TIMEZONE=America/La_Paz
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:-htk_n8n_encryption_secret_key_2026}
      - N8N_METRICS=false
      - N8N_DIAGNOSTICS_ENABLED=false
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5678/healthz"]
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - htk_net

  # 5. Servicio de Respaldos Automáticos Programados (Diarios)
  backups:
    image: mysql:8.0
    container_name: htk_backups
    restart: unless-stopped
    environment:
      TZ: ${TZ:-America/La_Paz}
      DB_HOST: mysql
      DB_USER: root
      DB_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret_pass_2026}
      DB_NAME: ${DB_NAME:-estetica_db}
      BACKUP_DIR: /backups
      BACKUP_RETENTION_DAYS: 7
    volumes:
      - backups_data:/backups
      - uploads_data:/uploads_source:ro
      - ./scripts:/scripts:ro
    entrypoint: >
      /bin/sh -c "
        chmod +x /scripts/backup.sh 2>/dev/null || true;
        echo 'Servicio de respaldos iniciado en zona horaria America/La_Paz';
        while true; do
          if [ -f /scripts/backup.sh ]; then
            /scripts/backup.sh || echo 'Error ejecutando respaldo programado';
          fi;
          sleep 86400;
        done
      "
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - htk_net

volumes:
  mysql_data:
    driver: local
  n8n_data:
    driver: local
  uploads_data:
    driver: local
  backups_data:
    driver: local

networks:
  htk_net:
    driver: bridge
